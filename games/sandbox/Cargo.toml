[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true

[dependencies]
# Sandboxen kör demoscenen, som ligger bakom en flagga i ymer-runtime.
# Den måste begäras här: i ett workspace-bygge kan flaggan råka vara på
# för att någon *annan* crate bett om den, och då bygger sandboxen ändå
# — tills någon bygger den för sig.
ymer-runtime = { workspace = true, features = ["demo"] }
anyhow = { workspace = true }
