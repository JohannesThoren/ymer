name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # winit behöver X11-headers för att bygga på Linux.
      - name: Systemberoenden
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev

      - name: Formatering
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features ymer-runtime/demo -- -D warnings

      - name: Tester
        run: cargo test --workspace --features ymer-runtime/demo

  # Renderingstesterna kräver en GPU eller en mjukvaru-Vulkan. lavapipe
  # duger och gör att bilderna faktiskt produceras i CI.
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # libvulkan1 är laddaren; mesa-vulkan-drivers ger lavapipe, en
      # mjukvaru-Vulkan. Utan laddaren hittas ingen drivrutin alls.
      - name: Systemberoenden
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vulkan-tools

      # Bekräfta att en adapter finns innan vi skyller ett fel på motorn.
      # VK_ICD_FILENAMES sätts medvetet inte: filnamnet skiljer mellan
      # Mesa-versioner (lvp_icd.json respektive lvp_icd.x86_64.json), och
      # laddaren hittar alla installerade ICD:er på egen hand.
      - name: Kontrollera Vulkan
        run: vulkaninfo --summary | head -30

      - name: Headless-rendering
        run: |
          cargo run --features ymer-runtime/demo -p ymer-runtime --example headless
          cargo run --features ymer-runtime/demo -p ymer-runtime --example scene_roundtrip
          cargo run -p ymer-runtime --example sprites2d
