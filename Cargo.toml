[workspace]
resolver = "3"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Johannes <johannes@lgjt.xyz>"]
license-file = "LICENSE"

# Alla versioner pinnas här så att crates aldrig glider isär.
# wgpu 30 + winit 0.30.13 är exakt vad egui 0.36 kräver (editorn i milstolpe 3).
[workspace.dependencies]
ymer-core = { path = "crates/ymer-core" }
ymer-render = { path = "crates/ymer-render" }
ymer-runtime = { path = "crates/ymer-runtime" }
ymer-scene = { path = "crates/ymer-scene" }
ymer-editor = { path = "crates/ymer-editor" }
ymer-script = { path = "crates/ymer-script" }
ymer-pak = { path = "crates/ymer-pak" }

wgpu = "30.0"
winit = "0.30.13"
bevy_ecs = "0.19"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }
ron = "0.12"
zstd = "0.13"
crc32fast = "1.5"
serde_json = "1.0"
wasmtime = "48.0"
wasmtime-wasi = "48.0"
oxc = { version = "0.149", features = ["transformer", "codegen", "semantic"] }
anyhow = "1.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1
# Debuginfo står för merparten av target/ – flera GB över ett helt
# workspace med wasmtime, wgpu och oxc. Radraden i en panik räcker gott.
debug = "line-tables-only"

[profile.dev.build-override]
debug = false

# Beroenden byggs alltid optimerat – annars är wgpu/naga plågsamt långsamt i debug.
[profile.dev.package."*"]
opt-level = 3
debug = false
